name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run postgres:migration-smoke
        env:
          MODELTRUTH_POSTGRES_SMOKE_REQUIRED: "true"
          MODELTRUTH_POSTGRES_SMOKE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/modeltruth_ci
      - run: npm run verify
      - name: Required live smoke on release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run live-smoke:gate
        env:
          MODELTRUTH_LIVE_SMOKE_REQUIRED: "true"
          MODELTRUTH_LIVE_SMOKE_BASE_URL: ${{ secrets.MODELTRUTH_LIVE_SMOKE_BASE_URL }}
          MODELTRUTH_LIVE_SMOKE_API_KEY: ${{ secrets.MODELTRUTH_LIVE_SMOKE_API_KEY }}
          MODELTRUTH_LIVE_SMOKE_MODEL: ${{ secrets.MODELTRUTH_LIVE_SMOKE_MODEL }}
      - run: npm run db:validate
      - run: npm run docker:validate

  ghcr-image:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/xxrenzhe/bes3:prod-${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/xxrenzhe/bes3:prod-{0}', github.ref_name) || 'ghcr.io/xxrenzhe/bes3:prod-latest' }}
