[supervisord]
nodaemon=true

[program:web]
command=env PORT=80 HOSTNAME=0.0.0.0 node apps/web/server.js
autostart=true
autorestart=true
stdout_logfile=/var/log/modeltruth/web.log
stderr_logfile=/var/log/modeltruth/web.err.log

[program:audit-worker]
command=node --import tsx apps/worker/src/index.ts
autostart=true
autorestart=true
numprocs=1

[program:scheduler]
command=node --import tsx apps/scheduler/src/index.ts
autostart=true
autorestart=true

[program:notifier]
command=node --import tsx apps/notifier/src/index.ts
autostart=true
autorestart=true
